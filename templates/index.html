<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial "Mi Rosita" & Pollería "Sabor & Sazón"</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <h1>Comercial "Mi Rosita"</h1>
                <h2>& Pollería "Sabor & Sazón"</h2>
                <p class="location"><i class="fa-solid fa-location-dot"></i> San José 449, Mochumí</p>
            </div>
            <button id="cartBtn" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount" class="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- Navegación por Categorías -->
    <nav class="category-nav">
        <button class="cat-btn active" data-category="pollos">Pollo a la Brasa</button>
        <button class="cat-btn" data-category="salchipapas">Salchipapas</button>
        <button class="cat-btn" data-category="hamburguesas">Hamburguesas</button>
        <button class="cat-btn" data-category="servicios">Servicios</button>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div id="menuContainer" class="menu-grid">
            <!-- Productos cargados dinámicamente -->
        </div>

        <!-- Sección Servicios (Impresiones) -->
        <div id="servicesContainer" class="services-section" style="display: none;">
            <div class="service-card">
                <h3><i class="fa-solid fa-print"></i> Fotocopias e Impresiones</h3>
                <p>Disponibles en formato <strong>A4</strong> (Blanco/Negro y Color).</p>
                <div class="services-spec-list">
                    <div class="spec-row">
                        <i class="fa-solid fa-check"></i>
                        <div>
                            <strong>Alta calidad</strong>
                            <p>Impresiones nítidas para trabajos, tareas y documentos.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Carrito Lateral (Drawer) -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <button id="closeCart" class="close-cart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cartItems" class="cart-items">
            <!-- Items del carrito -->
        </div>
        <div class="cart-footer">
            <div class="payment-method-selector">
                <label for="paymentDetail"><i class="fa-solid fa-wallet"></i> Método de Pago:</label>
                <select id="paymentDetail">
                    <option value="Yape">Yape</option>
                    <option value="Efectivo">Efectivo</option>
                </select>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">S/. 0.00</span>
            </div>
            <button id="whatsappOrder" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
